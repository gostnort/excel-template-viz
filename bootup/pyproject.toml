[project]
name = "excel-template-viz"
version = "0.1.1"
description = "Excel template visualization and data entry (NiceGUI)"
readme = "../README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "nicegui>=2.0",
    "pandas>=2.0",
    "polars>=0.20",
    "openpyxl>=3.1",
    "gspread>=6.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.2",
    "PyYAML>=6.0",
    "tomlkit>=0.13",
    "Pillow>=10.0",
    "cryptography",
]

[project.optional-dependencies]
ocr = [
    "paddleocr-mcp[local-cpu]>=0.8.5,<1.0",
    "opencv-python-headless>=4.8",
    "pillow-heif>=0.16",
    "beautifulsoup4>=4.12",
    "psutil>=5.9.0",
]
ocr-gpu = [
    "paddleocr-mcp[local]>=0.8.5,<1.0",
    "paddlepaddle-gpu==3.3.1",
    "opencv-python-headless>=4.8",
    "pillow-heif>=0.16",
    "beautifulsoup4>=4.12",
    "psutil>=5.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
# 仓库根目录：uv run --project bootup pytest tests/test_cli_dialog_toml.py -q
testpaths = ["../tests"]
pythonpath = [".."]

[tool.uv]
package = false
default-groups = ["dev"]

# Paddle GPU wheels live on the official cu129 index (not PyPI).
[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.uv.sources]
paddlepaddle-gpu = { index = "paddle-cu129" }
